name: Fast cached login

on:
  push:
    paths:
      - '.github/workflows/fast-login.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cached login instant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "  document.getElementById('authCopy').textContent = 'Проверяем доступ…';\n\n  await Promise.all([\n    syncFromServer(false),\n    syncSummary(false)\n  ]);\n\n  if (isAuthReady) {\n    hideAuth();\n    updateSessionTimer();\n  }\n"
          new = "  isAuthReady = true;\n  hideAuth();\n  updateUI();\n  updateSessionTimer();\n\n  Promise.all([\n    syncFromServer(false),\n    syncSummary(false)\n  ]).catch(() => {});\n"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one boot block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -F "Promise.all([" index.html
          grep -F "]).catch(() => {});" index.html
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Pelican tracker bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Open tracker immediately with valid cached session'
          git push
