name: Switch Pelican backend

on:
  push:
    paths:
      - '.github/workflows/switch-pelican-backend.yml'

permissions:
  contents: write

jobs:
  switch-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Apps Script URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://script.google.com/macros/s/AKfycbyVkJF-_Bhvr5pU1MdpCatrRXIwiMqQkIxDh1c5uYXA5OPRFXWuOG3ec6xh7EypXKWbog/exec'
          new = 'https://script.google.com/macros/s/AKfycby_wVeTdnrjy4ssYZiyLUKZrAvDjnC9qjbusD8XoVJ5jfGjAEk95YXoNwrZ0tII6s9Z4w/exec'
          if old not in text:
              raise SystemExit('Old SCRIPT_URL not found; refusing to modify anything')
          updated = text.replace(old, new, 1)
          if updated.count(new) != 1:
              raise SystemExit('Unexpected replacement count; refusing to commit')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit exact one-line migration
        shell: bash
        run: |
          git config user.name 'Pelican migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --exit-code --quiet && exit 0
          git commit -m 'Switch time tracker to Pelican backend'
          git push
