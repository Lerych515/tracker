name: Server journal sync

on:
  push:
    paths:
      - '.github/workflows/server-journal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer server journal when available
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """    state = {
      status: result.status || null,
      since: result.since || null
    };

    if (todayLog.length === 0 && result.status && result.since) {
      todayLog.push({
        type: result.status,
        ts: result.since,
        time: result.time || formatTime(result.since),
        hours: null
      });
    }

    saveData();
"""
          new = """    state = {
      status: result.status || null,
      since: result.since || null
    };

    if (Array.isArray(result.entries)) {
      todayLog = result.entries.map(entry => ({
        type: entry.type === 'out' ? 'out' : 'in',
        ts: entry.ts || null,
        time: entry.time || formatTime(entry.ts),
        hours: entry.hours || null
      }));
    } else if (todayLog.length === 0 && result.status && result.since) {
      todayLog.push({
        type: result.status,
        ts: result.since,
        time: result.time || formatTime(result.since),
        hours: null
      });
    }

    saveData();
"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected one sync block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -F "Array.isArray(result.entries)" index.html
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Pelican tracker bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Use server journal as source of truth'
          git push
